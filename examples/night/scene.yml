scene:
  name: night
  duration: 5
  fps: 24

environment:
  time_of_day: 0.05   # deep night, near midnight
  fog_density: 0.0
  cloud_density: 0.0
  rain_density: 0.0
  bug_density: 0.0

objects:
  - start: [-800, 2000, 500]
    end:   [ 800, 2000, 480]
    velocity: 120
    radius: 80
    color: [0.6, 0.65, 0.7]   # dim, faint against dark sky

  - start: [ 400, 1800, 620]
    end:   [-600, 2200, 600]
    velocity: 80
    radius: 60
    color: [0.55, 0.6, 0.65]

cameras:
  - position: [0, -500, 100]
    yaw: 0
    pitch: 10
    fov: 60

  - position: [300, -400, 120]
    yaw: -20
    pitch: 12
    fov: 55

  - position: [-300, -450, 90]
    yaw: 18
    pitch: 8
    fov: 65